# Non-confidential data. Unverified images allowed (still sandboxed), relaxed output rules.
name: standard
tier: standard
require_verified: false
allowed_ops: ["*"]
memory: 16g
timeout_seconds: 600
audit: true
warm: true
chunk_chars: 6000
# Remote providers (configured in ~/.sealed/remotes.yaml) are allowed here and only here.
# Identifiers are swapped for placeholders before the call and restored after: a reduction, not a guarantee.
allow_remote: true
pseudonymize: true
pseudonymize_names: true
pseudonymize_terms: []
output:
  max_chars: 2000000
  max_verbatim_span_words: 0
