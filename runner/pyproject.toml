[project]
name = "sealed"
version = "0.0.1"
description = "Runner for sealed apps: sandboxed, no-egress processing of confidential data"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "click>=8",
  "python-docx>=1.1",
  "pypdf>=4",
  "cryptography>=42",
]

[project.scripts]
sealed = "sealed.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
