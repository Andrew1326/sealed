services:
  gateway:
    build: .
    image: sealed/gateway:0.0.1
    ports: ["127.0.0.1:8470:8470"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # needed to launch sandboxes; the gateway itself never touches app data
      - sealed-state:/var/lib/sealed                # allowlist, verification reports, audit log
    environment:
      SEALED_GPU: "0"
    restart: unless-stopped
volumes:
  sealed-state:
